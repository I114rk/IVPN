name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Build application and installer
        shell: pwsh
        run: ./tool/build_installer.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: windows-package
          path: dist/IVPN-Setup-*.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v4
      - name: Build Android packages
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v6
        with:
          name: android-packages
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          android_artifacts="release-assets/android-packages"
          find release-assets -type f -print
          windows_package=$(find release-assets/windows-package -type f -name 'IVPN-Setup-*.zip' -print -quit)
          android_apk=$(find "$android_artifacts" -type f -name '*.apk' -print -quit)
          if [[ -z "$windows_package" || -z "$android_apk" ]]; then
            echo "Release artifacts are missing (Windows: $windows_package, APK: $android_apk)." >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$windows_package" "$android_apk" --clobber
          else
            gh release create "$tag" "$windows_package" "$android_apk" \
              --generate-notes --title "IVPN $tag"
          fi
